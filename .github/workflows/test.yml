name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage gate
        # `--cov-fail-under=93` で 93% を下回ると CI fail (劣化検出ゲート)。
        # 努力目標は 94% 維持 (feedback_test_coverage.md) だが、ゲート値は
        # 1 ポイントのバッファを残して 93% とし、軽微な変動で CI が頻繁に
        # 落ちないようにする。新規コードは引き続き 94% 維持を目指す運用。
        run: |
          python -m pytest tests/ --tb=short \
            --cov=app --cov-report=term \
            --cov-fail-under=93

  js-crypto:
    name: JS crypto primitives (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run primitives unit tests with coverage + gate
        # Node 22+ の WebCrypto API + node --test を使う ESM テスト。
        # `--experimental-test-coverage` は Node 22 で安定。include で
        # app/static/js/crypto 配下のみカバー対象に絞る (vendor は除外)。
        # `--test-coverage-lines=95` で line カバレッジ 95% 未満なら CI fail。
        # 出力: spec レポート (stdout) + lcov ファイル (CI artifact)。
        # 1 回のコマンドで gate と lcov 出力を同時に行い CI 実行時間を節約。
        run: |
          node --experimental-test-coverage \
            --test-coverage-include='app/static/js/crypto/**/*.js' \
            --test-coverage-lines=95 \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=js-coverage.lcov \
            --test tests/static/js/*.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-crypto-coverage
          path: js-coverage.lcov
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iikanji
          POSTGRES_PASSWORD: iikanji
          POSTGRES_DB: iikanji
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://iikanji:iikanji@localhost:5432/iikanji
      SECRET_KEY: ci-test-secret-key
      # #385: ログイン派生 MK の 2 ラウンドログイン/透過移行を E2E で有効化する。
      LOGIN_SERVER_SECRET: ci-test-login-server-secret
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/iikanji-test-vouchers
      RATELIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up database and start server
        run: |
          flask db upgrade
          flask seed
          flask run --host=0.0.0.0 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/login > /dev/null 2>&1; do sleep 1; done'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install firefox --with-deps

      - name: Run E2E tests
        # #385: 共有 e2e_test の初回ログイン移行が並列ワーカーで競合するため直列化する
        # (login 派生 MK は最初の 1 回だけ migration、以降 normal-path。workers=1 で
        # 競合を排除して deterministic にする)。
        run: npx playwright test tests/e2e/ --workers=1
