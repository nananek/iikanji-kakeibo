name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  js-crypto:
    name: JS crypto primitives (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run primitives unit tests
        # Node 22+ の WebCrypto API + node --test を使う ESM テスト。
        # primitives.js は worker.js が import する純粋関数 (E2EE 暗号プリミティブ)。
        run: node --test tests/static/js/*.mjs

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iikanji
          POSTGRES_PASSWORD: iikanji
          POSTGRES_DB: iikanji
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://iikanji:iikanji@localhost:5432/iikanji
      SECRET_KEY: ci-test-secret-key
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/iikanji-test-vouchers
      RATELIMIT_ENABLED: "false"
      # E2E は llama.cpp 互換 mock サーバーを localhost:11435 で立てる
      LLAMA_CPP_URL: http://localhost:11435

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up database and start server
        run: |
          flask db upgrade
          flask seed
          flask run --host=0.0.0.0 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/login > /dev/null 2>&1; do sleep 1; done'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install firefox --with-deps

      - name: Run E2E tests
        run: npx playwright test tests/e2e/
