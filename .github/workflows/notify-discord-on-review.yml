name: Notify Discord on claude-review verdict

# claude-review-bot が PR にコメントを残したとき、verdict (approve /
# request-changes / reject) を Discord webhook に通知する。
#
# 必要な repo secret:
#   DISCORD_REVIEW_WEBHOOK_URL  ... Discord チャンネルの Webhook URL
#
# 注意:
# - issue_comment.created と edited の両方を拾う (verdict が後追い編集される
#   ケースに対応)
# - claude-review-bot 以外のコメント / verdict 行を含まないコメントは無視
# - jq でメッセージを組み立て、curl で Discord に POST
# - DISCORD_REVIEW_WEBHOOK_URL 未設定なら skip (fork PR 等を想定)

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'claude-review-bot' &&
      contains(github.event.comment.body, 'verdict')
    runs-on: ubuntu-latest
    steps:
      - name: Parse verdict and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ github.event.issue.html_url }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_REVIEW_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          # verdict 行を抽出 (大小文字無視、markdown 太字 `**verdict:**` も対応)
          verdict_line=$(printf '%s' "$COMMENT_BODY" \
            | grep -iEm 1 '^(\*\*)?verdict[: *]+' || true)

          if [ -z "$verdict_line" ]; then
            echo "No verdict line found in comment body, skipping."
            exit 0
          fi

          # approve / request-changes / reject を判定
          if echo "$verdict_line" | grep -iqE 'approve'; then
            verdict_kind="approve"
            verdict_label="✅ approve"
            color=5763719   # green
          elif echo "$verdict_line" | grep -iqE 'request[- ]?changes'; then
            verdict_kind="request-changes"
            verdict_label="🟠 request-changes"
            color=15105570  # orange
          elif echo "$verdict_line" | grep -iqE 'reject'; then
            verdict_kind="reject"
            verdict_label="🔴 reject"
            color=15548997  # red
          else
            verdict_kind="other"
            verdict_label="❔ $verdict_line"
            color=10070709  # grey
          fi

          echo "Verdict: $verdict_kind"

          # Discord embed payload (jq でエスケープ)
          payload=$(jq -nc \
            --arg title "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg label "$verdict_label" \
            --arg author "$PR_AUTHOR" \
            --arg comment_url "$COMMENT_URL" \
            --argjson color "$color" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $label,
                color: $color,
                fields: [
                  {name: "PR Author", value: $author, inline: true},
                  {name: "Comment", value: "[Jump to review](\($comment_url))", inline: true}
                ],
                timestamp: now | todateiso8601
              }]
            }')

          # Discord に POST (失敗は echo するが workflow を fail させない)
          http_code=$(curl -sS -o /tmp/discord-response.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -X POST -d "$payload" \
            "$DISCORD_WEBHOOK") || true
          echo "Discord webhook responded with HTTP $http_code"
          if [ "$http_code" != "204" ] && [ "$http_code" != "200" ]; then
            echo "Response body:"
            cat /tmp/discord-response.txt
          fi
