name: Security

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  bandit:
    name: Bandit (Python 暗号弱点)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]==1.8.3"
      - name: Run Bandit
        run: |
          # 除外理由:
          # B101 (assert): テストで使用、本体には影響なし
          # B311 (random): 連番採番等で random.choice 等を使用、暗号用途は secrets を使用
          # B314 (xml ET.fromstring): app/services/sources/webdav.py で使用するが、
          #   v5.0 で Auto Import (WebDAV) は廃止予定 (設計書 §15.6)。それまでは
          #   サーバ運営者が設定した WebDAV ソースなので信頼境界内
          bandit -r app/ -ll \
            --skip B101,B311,B314 \
            -f txt

  gitleaks:
    name: gitleaks (シークレットコミット検知)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR の場合は base からの差分のみスキャン
          GITLEAKS_ENABLE_COMMENTS: false

  e2ee-plaintext-leak:
    name: 平文 E2EE 鍵漏れ検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run AST-based plaintext key linter
        run: |
          # scripts/lint_e2ee_plaintext.py が AST 解析で raw key 変数の logger/
          # jsonify/print への伝搬を検出 (文字列リテラルの誤検知を回避)。
          # 詳細は scripts/lint_e2ee_plaintext.py の docstring 参照。
          python scripts/lint_e2ee_plaintext.py app/
