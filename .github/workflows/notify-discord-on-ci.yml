name: Notify Discord when CI completes

# PR に紐づく全 GitHub Actions check が完了した瞬間に Discord webhook へ
# 1 通だけ通知する。GitHub は各 workflow ごとに check_suite を発火するため
# 12 workflows なら 12 回 job が起動するが、`pending` 件数が 0 になった
# 最後の 1 回だけが実際に通知を投稿する設計。
#
# 必要な repo secret:
#   DISCORD_REVIEW_WEBHOOK_URL  ... claude-review verdict と共用する
#                                   Discord チャンネルの Webhook URL
#
# 注意:
# - PR に紐づかない commit (push to develop / master) は無視
# - PENDING > 0 (まだ走ってる check がある) なら exit 0 で通知しない
# - DISCORD_REVIEW_WEBHOOK_URL 未設定なら skip (fork PR 等)

on:
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate status and post to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_REVIEW_WEBHOOK_URL is not set, skipping."
            exit 0
          fi

          # commit に紐づく open PR を取得
          PR_JSON=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" || echo '[]')
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with commit $HEAD_SHA, skipping."
            exit 0
          fi
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.[0].title // ""')
          PR_URL=$(echo "$PR_JSON" | jq -r '.[0].html_url // ""')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.[0].user.login // ""')

          # PR の全 check を集約
          STATUS=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,bucket)
          PENDING=$(echo "$STATUS" | jq '[.[] | select(.bucket=="pending")] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "Still pending ($PENDING checks), skipping."
            exit 0
          fi

          FAIL=$(echo "$STATUS" | jq '[.[] | select(.bucket=="fail")] | length')
          PASS=$(echo "$STATUS" | jq '[.[] | select(.bucket=="pass")] | length')
          SKIPPED=$(echo "$STATUS" | jq '[.[] | select(.bucket=="skipping")] | length')
          TOTAL=$(echo "$STATUS" | jq 'length')

          if [ "$FAIL" -gt 0 ]; then
            label="❌ $FAIL fail / $PASS pass"
            color=15548997   # red
            failed_names=$(echo "$STATUS" \
              | jq -r '[.[] | select(.bucket=="fail") | .name] | join(", ")')
          else
            label="✅ all green ($PASS pass$([ "$SKIPPED" -gt 0 ] && echo " / $SKIPPED skipped"))"
            color=5763719    # green
            failed_names=""
          fi

          echo "PR #$PR_NUMBER: $label"

          payload=$(jq -nc \
            --arg title "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg label "$label" \
            --arg author "$PR_AUTHOR" \
            --arg failed_names "$failed_names" \
            --argjson color "$color" \
            --argjson total "$TOTAL" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $label,
                color: $color,
                fields: (
                  [{name: "PR Author", value: $author, inline: true}]
                  + [{name: "Total checks", value: ($total | tostring), inline: true}]
                  + (if $failed_names != "" then
                       [{name: "Failed", value: $failed_names, inline: false}]
                     else [] end)
                ),
                timestamp: now | todateiso8601
              }]
            }')

          http_code=$(curl -sS -o /tmp/discord-response.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -X POST -d "$payload" \
            "$DISCORD_WEBHOOK") || true
          echo "Discord webhook responded with HTTP $http_code"
          if [ "$http_code" != "204" ] && [ "$http_code" != "200" ]; then
            echo "Response body:"
            cat /tmp/discord-response.txt
          fi
