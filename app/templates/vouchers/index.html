{% extends "base.html" %}
{% block title %}証憑一覧 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="vouchers-index-params" type="application/json">
{{ {"user_id": effective_user_id, "can_delete": can_delete, "is_audit_proxy": session.get('acting_as_user_id') is not none} | tojson }}
</script>
<script id="vouchers-index-meta" type="application/json">
{{ voucher_meta | tojson }}
</script>

<h2><i class="bi bi-file-image"></i> 証憑一覧</h2>

{# 電帳法 検索 (日付・金額・摘要) はクライアント側で復号済みカードを絞り込む。 #}
<div class="row g-2 mb-4 mt-3">
  <div class="col-auto">
    <input type="date" id="v-date-from" class="form-control form-control-sm" placeholder="開始日">
  </div>
  <div class="col-auto d-flex align-items-center">〜</div>
  <div class="col-auto">
    <input type="date" id="v-date-to" class="form-control form-control-sm" placeholder="終了日">
  </div>
  <div class="col-auto">
    <div class="input-group input-group-sm">
      <span class="input-group-text">&yen;</span>
      <input type="number" id="v-amount-from" class="form-control" style="width:100px;" placeholder="最小" min="0">
    </div>
  </div>
  <div class="col-auto d-flex align-items-center">〜</div>
  <div class="col-auto">
    <div class="input-group input-group-sm">
      <span class="input-group-text">&yen;</span>
      <input type="number" id="v-amount-to" class="form-control" style="width:100px;" placeholder="最大" min="0">
    </div>
  </div>
  <div class="col-auto">
    <input type="text" id="v-search" class="form-control form-control-sm" placeholder="摘要で検索">
  </div>
  <div class="col-auto">
    <a href="#" id="v-reset" class="btn btn-outline-secondary btn-sm">リセット</a>
  </div>
</div>

<div id="vouchers-index-status" class="d-none" role="status" aria-live="polite"></div>

<div id="vouchers-index-grid" class="row g-3 d-none"></div>

<div id="vouchers-index-empty" class="text-center text-muted py-5 d-none">
  <i class="bi bi-file-image" style="font-size: 3rem;"></i>
  <p class="mt-3">証憑が見つかりません。</p>
</div>

<script type="module" src="{{ url_for('static', filename='js/vouchers/index_renderer.mjs') }}"></script>
{% endblock %}
