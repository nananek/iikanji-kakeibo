{% extends "base.html" %}
{% block title %}{{ page_title }} - {{ operator.service_name }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
  <h1 class="mb-4">{{ page_title }}</h1>
  {% block legal_content %}{% endblock %}
  <hr class="my-4">
  <p class="text-muted small mb-0">
    最終更新: {{ operator.legal_updated_at }}
  </p>
  <p class="text-muted small mb-0 mt-2">
    <a href="{{ url_for('legal.show', slug='terms') }}">利用規約</a> |
    <a href="{{ url_for('legal.show', slug='privacy') }}">プライバシーポリシー</a> |
    <a href="{{ url_for('legal.show', slug='tokushoho') }}">特定商取引法に基づく表記</a>
  </p>
</div>
{% endblock %}
