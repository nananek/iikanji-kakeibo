{# 照合結果テーブル — reconcileMode コンポーネント内で使用 #}

<!-- ローディング -->
<div x-show="reconcileLoading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="mt-2 text-muted">照合中…</p>
</div>

<template x-if="reconcileLoaded">
<div>
  {# --- 日計サマリー --- #}
  <div class="card shadow-sm mt-4 position-relative" x-show="dailySummary.length > 0">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong><i class="bi bi-calendar-check"></i> 日計サマリー</strong>
      <span class="badge bg-danger" x-show="discrepancyCount > 0">
        <i class="bi bi-exclamation-triangle"></i> 過不足 <span x-text="discrepancyCount"></span>日
      </span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
        <table class="table table-sm table-hover mb-0">
          <thead class="table-light sticky-top">
            <tr>
              <th>日付</th>
              <th class="text-end">CSV件数</th>
              <th class="text-end">CSV合計</th>
              <th class="text-end">仕訳件数</th>
              <th class="text-end">仕訳合計</th>
              <th class="text-end">差額</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(day, dayIdx) in dailySummary" :key="day.date">
              <tr :class="{
                'table-danger': day.has_discrepancy && day.csv_count > 0 && day.journal_count > 0,
                'table-warning': day.has_discrepancy && (day.csv_count === 0 || day.journal_count === 0),
              }"
              style="cursor: pointer;"
              @mouseenter="day.has_discrepancy && hoverEnter(day.date)"
              @mouseleave="hoverLeave()">
                <td x-text="day.date"></td>
                <td class="text-end" x-text="day.csv_count"></td>
                <td class="text-end" x-text="'\u00a5' + day.csv_total.toLocaleString()"></td>
                <td class="text-end" x-text="day.journal_count"></td>
                <td class="text-end" x-text="'\u00a5' + day.journal_total.toLocaleString()"></td>
                <td class="text-end fw-bold" :class="{
                  'text-danger': day.diff_amount > 0,
                  'text-primary': day.diff_amount < 0,
                }">
                  <template x-if="day.diff_amount !== 0">
                    <span x-text="(day.diff_amount > 0 ? '+' : '') + '\u00a5' + day.diff_amount.toLocaleString()"></span>
                  </template>
                  <template x-if="day.diff_amount === 0 && day.diff_count !== 0">
                    <span class="text-warning">件数差 <span x-text="day.diff_count > 0 ? '+' + day.diff_count : day.diff_count"></span></span>
                  </template>
                  <template x-if="day.pending_card_amount > 0">
                    <div class="text-muted small fw-normal"
                         x-text="'うちカード未達 ¥' + day.pending_card_amount.toLocaleString()"></div>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
          <tfoot class="table-dark">
            <tr>
              <th>合計</th>
              <th class="text-end" x-text="summaryTotals.csv_count"></th>
              <th class="text-end" x-text="'\u00a5' + summaryTotals.csv_total.toLocaleString()"></th>
              <th class="text-end" x-text="summaryTotals.journal_count"></th>
              <th class="text-end" x-text="'\u00a5' + summaryTotals.journal_total.toLocaleString()"></th>
              <th class="text-end fw-bold" :class="{
                'text-danger': summaryTotals.diff_amount > 0,
                'text-info': summaryTotals.diff_amount < 0,
                'text-success': summaryTotals.diff_amount === 0 && summaryTotals.diff_count === 0,
              }">
                <template x-if="summaryTotals.diff_amount === 0 && summaryTotals.diff_count === 0">
                  <span><i class="bi bi-check-circle-fill"></i> 一致</span>
                </template>
                <template x-if="summaryTotals.diff_amount !== 0">
                  <span x-text="(summaryTotals.diff_amount > 0 ? 'CSV+' : '仕訳+') + '\u00a5' + Math.abs(summaryTotals.diff_amount).toLocaleString()"></span>
                </template>
                <template x-if="summaryTotals.diff_amount === 0 && summaryTotals.diff_count !== 0">
                  <span>件数差 <span x-text="summaryTotals.diff_count > 0 ? '+' + summaryTotals.diff_count : summaryTotals.diff_count"></span></span>
                </template>
              </th>
            </tr>
          </tfoot>
        </table>
      </div>
      {# ホバーdiff — 左右2列 #}
      <div x-show="hoveredDay" x-cloak
           @mouseenter="hoverEnter(hoveredDay)"
           @mouseleave="hoverLeave()"
           class="card shadow border position-absolute"
           style="z-index: 1050; width: 600px; right: 0; top: 0;">
        <div class="card-header py-1 px-2 d-flex justify-content-between">
          <small class="fw-bold" x-text="hoveredDay"></small>
          <small class="text-muted" x-text="'差額: ¥' + Math.abs(
            (getDayDiff(hoveredDay).csv.reduce(function(s,r){return s+r.amount},0)) -
            (getDayDiff(hoveredDay).journal.reduce(function(s,r){return s+r.amount},0))
          ).toLocaleString()"></small>
        </div>
        <div class="card-body p-0" style="font-size: 0.8rem; max-height: 300px; overflow-y: auto;">
          <div class="row g-0">
            {# 左: CSV明細 #}
            <div class="col-6 border-end" style="min-height: 40px;">
              <div class="px-2 py-1 bg-light border-bottom"><strong>CSV明細</strong></div>
              <template x-for="(r, ri) in getDayDiff(hoveredDay).csv" :key="ri">
                <div class="d-flex justify-content-between px-2 py-1 border-bottom"
                     :class="r.status === 'matched' ? 'text-muted' : ''">
                  <span class="text-truncate" style="max-width: 180px;">
                    <i class="bi" :class="r.status === 'matched' ? 'bi-check-lg text-success' : 'bi-x-lg text-danger'" style="font-size:0.7rem"></i>
                    <span x-text="r.description"></span>
                  </span>
                  <span class="text-nowrap" x-text="'\u00a5' + r.amount.toLocaleString()"></span>
                </div>
              </template>
              <div x-show="getDayDiff(hoveredDay).csv.length === 0" class="px-2 py-1 text-muted">(なし)</div>
            </div>
            {# 右: 仕訳 #}
            <div class="col-6" style="min-height: 40px;">
              <div class="px-2 py-1 bg-light border-bottom"><strong>仕訳</strong></div>
              <template x-for="(j, ji) in getDayDiff(hoveredDay).journal" :key="ji">
                <div class="d-flex justify-content-between px-2 py-1 border-bottom"
                     :class="j.matched ? 'text-muted' : ''">
                  <span class="text-truncate" style="max-width: 180px;">
                    <i class="bi" :class="j.matched ? 'bi-check-lg text-success' : 'bi-x-lg text-primary'" style="font-size:0.7rem"></i>
                    <span x-text="j.description"></span>
                  </span>
                  <span class="text-nowrap" x-text="'\u00a5' + j.amount.toLocaleString()"></span>
                </div>
              </template>
              <div x-show="getDayDiff(hoveredDay).journal.length === 0" class="px-2 py-1 text-muted">(なし)</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  {# --- カード会社未達（レシート起票済み・明細未到着） --- #}
  <div class="card shadow-sm mt-3 border-warning" x-show="visibleJournalOnly.length > 0">
    <div class="card-header bg-warning bg-opacity-25">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <strong><i class="bi bi-credit-card-2-front"></i> カード会社未達</strong>
          <span class="text-muted ms-2 small">レシート起票済み・明細未到着</span>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <span class="badge bg-warning text-dark" x-text="visibleJournalOnly.length + '件'"></span>
          <span class="badge bg-light text-dark"
                x-text="'¥' + journalOnlyTotal.toLocaleString()"></span>
          <button type="button" class="btn btn-sm btn-outline-secondary"
                  x-show="hiddenJournalOnlyIds.length > 0"
                  @click="resetHiddenJournalOnly()"
                  :title="hiddenJournalOnlyIds.length + ' 件の非表示を解除'">
            <i class="bi bi-arrow-counterclockwise"></i> 非表示を戻す
          </button>
        </div>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 280px; overflow-y: auto;">
        <table class="table table-sm table-hover mb-0">
          <thead class="table-light sticky-top">
            <tr>
              <th>日付</th>
              <th>摘要</th>
              <th class="text-end">金額</th>
              <th>科目</th>
              <th>経過</th>
              <th class="text-end" style="width:120px"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="j in visibleJournalOnly" :key="j.entry_id">
              <tr class="table-warning">
                <td x-text="j.date"></td>
                <td class="text-truncate" style="max-width:200px" x-text="j.description"></td>
                <td class="text-end fw-bold" x-text="'\u00a5' + j.amount.toLocaleString()"></td>
                <td>
                  <span class="badge bg-light text-dark" x-text="j.category_name"></span>
                  <span class="badge bg-info text-dark" x-text="sourceLabel(j.source)"></span>
                </td>
                <td>
                  <span class="badge"
                        :class="j.is_stale ? 'bg-danger' : 'bg-secondary'"
                        x-text="(j.is_stale ? '\u9577\u671f\u672a\u7740 ' : '') + j.days_since_journal + '\u65e5'"></span>
                </td>
                <td class="text-end">
                  <a :href="'/journal/' + j.entry_id + '/edit'"
                     target="_blank" rel="noopener"
                     class="btn btn-sm btn-outline-primary"
                     title="\u65b0\u3057\u3044\u30bf\u30d6\u3067\u4ed5\u8a33\u7de8\u96c6\u753b\u9762\u3092\u958b\u304d\u307e\u3059">
                    <i class="bi bi-pencil"></i> \u7de8\u96c6
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-secondary"
                          @click="hideJournalOnly(j.entry_id)"
                          title="\u3053\u306e\u30ab\u30fc\u30c9\u3067\u306f\u6271\u308f\u306a\u3044\uff08\u4e00\u6642\u7684\u306b\u96a0\u3059\uff09">
                    <i class="bi bi-x"></i>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  {# --- 明細照合テーブル --- #}
  <div class="card shadow-sm mt-3">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <strong>照合結果</strong>
          <span class="text-muted ms-2">取込先: {{ payment_account.name }}</span>
        </div>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleAllReconcile(true)">全選択</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleAllReconcile(false)">全解除</button>
          <span class="badge bg-success"><i class="bi bi-check-circle"></i> 照合済 <span x-text="matchedExactCount"></span>件</span>
          <span class="badge bg-warning text-dark" x-show="matchedWarnCount > 0">
            <i class="bi bi-calendar-event"></i> 日付ズレ <span x-text="matchedWarnCount"></span>件
          </span>
          <span class="badge bg-warning text-dark" x-show="matchedCautionCount > 0">
            <i class="bi bi-exclamation-triangle"></i> 要確認 <span x-text="matchedCautionCount"></span>件
          </span>
          <span class="badge bg-warning text-dark" x-show="multipleCount > 0"><i class="bi bi-question-circle"></i> 複数候補 <span x-text="multipleCount"></span>件</span>
          <span class="badge bg-secondary"><i class="bi bi-dash-circle"></i> 未照合 <span x-text="unmatchedCount"></span>件</span>
          <button type="button" class="btn btn-sm btn-outline-info" x-show="hasAiConfig && unmatchedCount > 0 && journalOnly.length > 0"
                  @click="runAiReconcile()" :disabled="aiReconcileLoading">
            <template x-if="aiReconcileLoading"><span class="spinner-border spinner-border-sm"></span></template>
            <template x-if="!aiReconcileLoading"><i class="bi bi-robot"></i></template>
            AI照合
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <form method="POST" @submit="serializeReconcileRows()">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="import_rows" x-ref="reconcileImportRows">

        <div class="table-responsive">
          <table class="table table-sm table-hover">
            <thead class="table-light">
              <tr>
                <th style="width:3%">取込</th>
                <th style="width:7%">状態</th>
                <th style="width:10%">日付</th>
                <th style="width:20%">摘要(CSV)</th>
                <th style="width:8%" class="text-end">入金</th>
                <th style="width:8%" class="text-end">出金</th>
                <th style="width:44%">照合先 / 費目</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, index) in reconcileRows" :key="row.csv_index">
                <tr :class="{
                  'table-success': row.status === 'matched' && row.matchInfo && (!row.matchInfo.date_band || row.matchInfo.date_band === 'exact'),
                  'table-warning': (row.status === 'matched' && row.matchInfo && row.matchInfo.date_band && row.matchInfo.date_band !== 'exact') || row.status === 'multiple',
                  'table-info': row.status === 'ai_suggested',
                }">
                  <td>
                    <input type="checkbox" class="form-check-input"
                           x-model="row.enabled"
                           :disabled="row.status === 'matched' || (row.status === 'multiple' && row.selectedMatchIndex >= 0)">
                  </td>
                  <td>
                    <template x-if="row.status === 'matched' && row.matchInfo && row.matchInfo.date_band === 'warn'">
                      <span class="badge bg-warning text-dark"
                            :title="'CSV ' + row.date + ' ⇄ 仕訳 ' + row.matchInfo.date + ' (差 ' + (row.matchInfo.date_diff_days > 0 ? '+' : '') + row.matchInfo.date_diff_days + '日)'">
                        <i class="bi bi-calendar-event"></i> 日付ズレ<span x-text="' ' + (row.matchInfo.date_diff_days > 0 ? '+' : '') + row.matchInfo.date_diff_days + '日'"></span>
                      </span>
                    </template>
                    <template x-if="row.status === 'matched' && row.matchInfo && row.matchInfo.date_band === 'caution'">
                      <span class="badge bg-warning text-dark"
                            :title="'CSV ' + row.date + ' ⇄ 仕訳 ' + row.matchInfo.date + ' (差 ' + (row.matchInfo.date_diff_days > 0 ? '+' : '') + row.matchInfo.date_diff_days + '日)'">
                        <i class="bi bi-exclamation-triangle"></i> 要確認<span x-text="' ' + (row.matchInfo.date_diff_days > 0 ? '+' : '') + row.matchInfo.date_diff_days + '日'"></span>
                      </span>
                    </template>
                    <template x-if="row.status === 'matched' && row.matchInfo && (!row.matchInfo.date_band || row.matchInfo.date_band === 'exact')">
                      <span class="badge bg-success"><i class="bi bi-check-circle"></i> 照合済</span>
                    </template>
                    <template x-if="row.status === 'multiple'">
                      <span class="badge bg-warning text-dark">複数候補</span>
                    </template>
                    <template x-if="row.status === 'unmatched'">
                      <span class="badge bg-secondary">未照合</span>
                    </template>
                    <template x-if="row.status === 'ai_suggested'">
                      <span class="badge bg-info text-dark">AI候補</span>
                    </template>
                  </td>
                  <td x-text="row.date || '(不明)'"></td>
                  <td class="text-truncate" style="max-width:200px" x-text="row.description"></td>
                  <td class="text-end" :class="{'text-primary fw-bold': row.deposit}">
                    <template x-if="row.deposit">
                      <span x-text="'\u00a5' + row.deposit.toLocaleString()"></span>
                    </template>
                  </td>
                  <td class="text-end" :class="{'text-danger fw-bold': row.withdrawal}">
                    <template x-if="row.withdrawal">
                      <span x-text="'\u00a5' + row.withdrawal.toLocaleString()"></span>
                    </template>
                  </td>
                  <td>
                    <!-- matched: 既存仕訳情報 -->
                    <template x-if="row.status === 'matched'">
                      <div class="small">
                        <div>
                          <i class="bi bi-link-45deg text-success"></i>
                          <span x-text="row.matchInfo.date"></span>
                          <span class="text-muted" x-text="row.matchInfo.description"></span>
                          <span class="badge bg-light text-dark" x-text="row.matchInfo.category_name"></span>
                          <span class="badge bg-info text-dark" x-text="sourceLabel(row.matchInfo.source)"></span>
                        </div>
                        <template x-if="row.matchInfo && row.matchInfo.date_band && row.matchInfo.date_band !== 'exact' && row.date">
                          <div class="mt-1">
                            <button type="button" class="btn btn-sm btn-outline-primary"
                                    @click="snapDate(index)" :disabled="row.snapping"
                                    :title="'仕訳の日付を ' + row.date + ' に変更して exact 照合にします'">
                              <template x-if="row.snapping"><span class="spinner-border spinner-border-sm me-1"></span></template>
                              <template x-if="!row.snapping"><i class="bi bi-calendar-check"></i></template>
                              <span x-text="' 日付を ' + row.date + ' に合わせる'"></span>
                            </button>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- ai_suggested: AI照合候補 -->
                    <template x-if="row.status === 'ai_suggested'">
                      <div class="small">
                        <i class="bi bi-robot text-info"></i>
                        <span x-text="row.matchInfo.date"></span>
                        <span class="text-muted" x-text="row.matchInfo.description"></span>
                        <span class="badge bg-light text-dark" x-text="row.matchInfo.category_name"></span>
                        <span class="badge" :class="row.matchInfo.confidence >= 0.7 ? 'bg-success' : 'bg-warning text-dark'"
                              x-text="Math.round(row.matchInfo.confidence * 100) + '%'"></span>
                        <span class="text-muted small" x-text="row.matchInfo.reason"></span>
                      </div>
                    </template>

                    <!-- multiple: ドロップダウン + 条件付き費目選択 -->
                    <template x-if="row.status === 'multiple'">
                      <div>
                        <select class="form-select form-select-sm"
                                @change="selectMatch(index, parseInt($event.target.value))">
                          <option value="-1" :selected="row.selectedMatchIndex === -1">-- 新規取込 --</option>
                          <template x-for="(m, mi) in row.matches" :key="m.entry_id">
                            <option :value="mi" :selected="row.selectedMatchIndex === mi"
                                    x-text="m.date + ' ' + m.description + ' (' + m.category_name + ') [' + sourceLabel(m.source) + ']'"></option>
                          </template>
                        </select>
                        <div class="mt-1" x-show="row.selectedMatchIndex < 0">
                          <button type="button" class="form-control form-control-sm text-start"
                                  @click="selectReconcileCategory(index)">
                            <span :class="{'text-muted': !row.category_name}"
                                  x-text="row.category_name || '-- 科目を選択 --'"></span>
                          </button>
                        </div>
                      </div>
                    </template>

                    <!-- unmatched: 費目選択 -->
                    <template x-if="row.status === 'unmatched'">
                      <button type="button" class="form-control form-control-sm text-start"
                              @click="selectReconcileCategory(index)">
                        <span :class="{'text-muted': !row.category_name}"
                              x-text="row.category_name || '-- 科目を選択 --'"></span>
                      </button>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="d-flex gap-2 align-items-center mt-3">
          <button type="submit" class="btn btn-primary btn-lg" :disabled="reconcileImportCount === 0">
            <i class="bi bi-check-lg"></i>
            未照合 <span x-text="reconcileImportCount">0</span>件を取り込む
          </button>
          <a href="{{ url_for('csv_import.mapping') }}" class="btn btn-outline-secondary">マッピングに戻る</a>
          <a href="{{ url_for('csv_import.upload') }}" class="btn btn-outline-secondary">最初からやり直す</a>
        </div>
      </form>
    </div>
  </div>
</div>{# /reconcileLoaded wrapper #}
</template>
