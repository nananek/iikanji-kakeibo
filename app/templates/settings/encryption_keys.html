{% extends "base.html" %}
{% block title %}暗号鍵管理 - いいかんじ™家計簿{% endblock %}

{% block content %}
<h2 class="mb-3"><i class="bi bi-shield-lock"></i> 暗号鍵管理 (v5.0 準備)</h2>

<div class="alert alert-warning small">
  <i class="bi bi-info-circle"></i>
  <strong>プレビュー機能:</strong> v5.0 で導入予定のエンドツーエンド暗号化 (E2EE) の鍵管理基盤です。
  現在は鍵の<strong>登録</strong>のみ可能で、仕訳や証憑への暗号化適用は次期マイルストーンで段階的に行われます。
  鍵を登録しても既存の家計簿データへの影響はありません。
</div>

<div x-data="encryptionKeyWizard({ userId: {{ current_user.id|tojson }} })" x-init="init()" class="card shadow-sm">
  <div class="card-body">

    <!-- エラー表示 -->
    <div class="alert alert-danger small" x-show="error" x-text="error" x-cloak></div>

    <!-- ステップ 1: 開始画面 -->
    <template x-if="step === 'start'">
      <div>
        <h5 class="mb-3">
          <i class="bi bi-list-check"></i> 登録済みの鍵
          <template x-if="existingKeys.length > 0">
            <span class="ms-2">
              <template x-if="hasKey">
                <span class="badge bg-success">解除済み</span>
              </template>
              <template x-if="!hasKey">
                <span class="badge bg-warning text-dark">ロック中</span>
              </template>
            </span>
          </template>
        </h5>

        <template x-if="existingKeys.length === 0">
          <p class="text-muted small">まだ暗号鍵が登録されていません。下のボタンから初回設定を開始してください。</p>
        </template>

        <template x-if="existingKeys.length > 0">
          <div>
            <p class="text-muted small mb-2" x-show="!hasKey" x-cloak>
              ロック中です。下のいずれかの鍵を選んで解除してください。
            </p>
            <p class="text-muted small mb-2" x-show="hasKey" x-cloak>
              暗号鍵は SharedWorker にロードされています (60 分操作なしで自動ロック)。
            </p>
            <ul class="list-group mb-3">
              <template x-for="k in existingKeys" :key="k.id">
                <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div>
                    <span class="badge bg-secondary me-2" x-text="k.method"></span>
                    <span x-text="k.label || '(ラベルなし)'"></span>
                  </div>
                  <div class="d-flex gap-2 align-items-center">
                    <small class="text-muted" x-text="k.created_at"></small>
                    <template x-if="!hasKey">
                      <button class="btn btn-sm btn-outline-primary" @click="goToUnlock(k)">
                        <i class="bi bi-unlock"></i> この鍵で解除
                      </button>
                    </template>
                    <!-- 削除は解錠中のみ (誤って最後の鍵を消さないよう、登録が
                         2 件以上のときだけ表示。最終 1 件はサーバも 409 で保護) -->
                    <template x-if="hasKey && existingKeys.length > 1">
                      <button class="btn btn-sm btn-outline-danger" @click="deleteKey(k)"
                              :disabled="loading" title="この鍵を削除">
                        <i class="bi bi-trash"></i>
                      </button>
                    </template>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <div class="d-flex gap-2 mt-4 flex-wrap">
          <template x-if="existingKeys.length === 0">
            <button class="btn btn-primary" @click="proceedChoose()">
              <i class="bi bi-key"></i> 初回設定を開始
            </button>
          </template>
          <template x-if="existingKeys.length > 0 && hasKey">
            <button class="btn btn-primary btn-sm" @click="addAnotherMethod()" :disabled="loading">
              <i class="bi bi-plus-lg"></i> 別の方式を追加
            </button>
          </template>
          <template x-if="existingKeys.length > 0 && hasKey">
            <button class="btn btn-outline-secondary btn-sm" @click="lockKey()" :disabled="loading">
              <i class="bi bi-lock"></i> 今すぐロックする
            </button>
          </template>
          <template x-if="existingKeys.length > 0 && !hasKey">
            <span class="text-muted small ms-2 align-self-center">
              鍵を解除すると、別方式の追加や鍵の削除ができます。
            </span>
          </template>
        </div>
      </div>
    </template>

    <!-- ステップ 1.5: ロック解除画面 -->
    <template x-if="step === 'unlock'">
      <div>
        <h5 class="mb-3"><i class="bi bi-unlock"></i> ロック解除</h5>
        <p class="text-muted small">
          選択した鍵: <span class="badge bg-secondary" x-text="unlockingKey?.method"></span>
          <span x-text="unlockingKey?.label || '(ラベルなし)'"></span>
        </p>

        <!-- パスフレーズ方式 -->
        <template x-if="unlockingKey?.method === 'passphrase'">
          <div>
            <div class="mb-3">
              <label class="form-label">パスフレーズ</label>
              <input type="password" class="form-control" x-model="unlockPassphrase"
                     :disabled="loading" autocomplete="current-password"
                     @keydown.enter.prevent="unlockWithPassphrase()">
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" @click="unlockWithPassphrase()" :disabled="loading">
                <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
                <span x-text="loading ? '派生中...' : '解除する'"></span>
              </button>
              <button class="btn btn-outline-secondary" @click="step = 'start'" :disabled="loading">
                戻る
              </button>
            </div>
          </div>
        </template>

        <!-- リカバリシード方式 -->
        <template x-if="unlockingKey?.method === 'recovery_seed'">
          <div>
            <div class="mb-3">
              <label class="form-label">24 単語のリカバリシード (半角スペース区切り)</label>
              <textarea class="form-control font-monospace" rows="3" x-model="unlockMnemonic"
                        :disabled="loading" autocomplete="off" spellcheck="false"
                        placeholder="abandon abandon ... art"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" @click="unlockWithRecovery()" :disabled="loading">
                <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
                <span x-text="loading ? '検証中...' : '解除する'"></span>
              </button>
              <button class="btn btn-outline-secondary" @click="step = 'start'" :disabled="loading">
                戻る
              </button>
            </div>
          </div>
        </template>

        <!-- Passkey 方式 -->
        <template x-if="unlockingKey?.method === 'passkey_prf'">
          <div>
            <p class="text-muted small">
              ボタンを押すと Passkey 認証 (指紋・Face ID 等) が起動します。
            </p>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" @click="unlockWithPasskey()" :disabled="loading">
                <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-fingerprint me-1"></i>
                <span x-text="loading ? '認証中...' : 'Passkey で解除する'"></span>
              </button>
              <button class="btn btn-outline-secondary" @click="step = 'start'" :disabled="loading">
                戻る
              </button>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ステップ 2: 方式選択 -->
    <template x-if="step === 'choose'">
      <div>
        <h5 class="mb-3">
          <i class="bi bi-2-square"></i>
          <span x-text="addMode ? '追加する方式を選択' : '派生方式を選択'"></span>
        </h5>
        <p class="text-muted small" x-show="!addMode">
          マスター鍵 (MK) を保護する派生方式を選んでください。<strong>1 つ目</strong>の方式は初回必須です。
          後からこの画面で別方式を追加・削除できます。
        </p>
        <p class="text-muted small" x-show="addMode" x-cloak>
          解除中の暗号鍵を、選んだ方式でも保護します (同じ鍵を別の方法で解除できるようになります)。
        </p>

        {# #385: パスフレーズ単独方式は廃止 (= ログインパスワードに統合)。MK の常用解錠は
           ログインパスワードが担うため、ここで追加できるのはリカバリシード (緊急用) と
           Passkey (任意の上乗せ) の 2 方式。 #}
        <div class="row row-cols-1 row-cols-md-2 g-3">
          <div class="col">
            <button class="btn btn-outline-primary w-100 text-start p-3"
                    @click="selectRecovery()" :disabled="loading">
              <h6 class="mb-1"><i class="bi bi-card-list"></i> リカバリシード (24 単語)</h6>
              <small class="text-muted">BIP-39 形式の 24 単語フレーズ。<strong>緊急復旧用</strong>、紙にメモして保管。
                パスワードを忘れたときの命綱です。</small>
            </button>
          </div>
          <div class="col">
            <button class="btn btn-outline-primary w-100 text-start p-3"
                    @click="selectPasskey()" :disabled="loading">
              <h6 class="mb-1"><i class="bi bi-fingerprint"></i> Passkey</h6>
              <small class="text-muted">指紋・Face ID 等の任意の上乗せ。<br>
                WebAuthn PRF 対応のパスキーが必要 (Bitwarden 等の一部管理ツールは非対応)。</small>
            </button>
            <small class="d-block text-muted text-center mt-1">
              Passkey 未登録の場合は
              <a href="{{ url_for('settings.passkeys') }}">Passkey 管理</a>
              で先に登録してください。
            </small>
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-link btn-sm" @click="backToStart()">
            <i class="bi bi-arrow-left"></i> 戻る
          </button>
        </div>
      </div>
    </template>

    <!-- ステップ 3a: パスフレーズ入力 -->
    <template x-if="step === 'passphrase'">
      <div>
        <h5 class="mb-3"><i class="bi bi-key"></i> パスフレーズ設定</h5>
        <p class="text-muted small">
          8 文字以上のパスフレーズを設定します。Argon2id (64 MiB / 3 iter) で派生します。
          <strong>このパスフレーズを忘れると MK 復元不能になります。</strong>
        </p>
        <div class="mb-3">
          <label class="form-label">パスフレーズ</label>
          <input type="password" class="form-control" x-model="passphrase"
                 :disabled="loading" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label">パスフレーズ (確認)</label>
          <input type="password" class="form-control" x-model="passphraseConfirm"
                 :disabled="loading" autocomplete="new-password">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" @click="submitPassphrase()" :disabled="loading">
            <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
            <span x-text="loading ? '派生中...' : '登録する'"></span>
          </button>
          <button class="btn btn-outline-secondary" @click="goToChoose()" :disabled="loading">
            戻る
          </button>
        </div>
      </div>
    </template>

    <!-- ステップ 3b: リカバリシード生成 -->
    <template x-if="step === 'recovery'">
      <div>
        <h5 class="mb-3"><i class="bi bi-card-list"></i> リカバリシード (24 単語)</h5>
        <div class="alert alert-danger small">
          <strong><i class="bi bi-exclamation-triangle"></i> この 24 単語が表示されるのは 1 回のみ</strong>。
          紙にメモして安全に保管してください (スクリーンショットや写真は推奨しません — クラウド同期で漏洩リスク)。
          紛失すると MK 復元不可能、再生成は MK アンラップ済の状態でのみ可能です。
        </div>
        <div class="card bg-light mb-3">
          <div class="card-body">
            <div class="row row-cols-3 row-cols-md-4 row-cols-lg-6 g-2 small font-monospace">
              <template x-for="(word, idx) in mnemonic.split(' ')" :key="idx">
                <div class="col">
                  <span class="text-muted" x-text="(idx + 1) + '.'"></span>
                  <span x-text="word"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="mnemonic-acked"
                 x-model="mnemonicAcked" :disabled="loading">
          <label class="form-check-label" for="mnemonic-acked">
            24 単語を紙にメモしました。紛失すると復元不可能であることを理解しました。
          </label>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" @click="submitRecovery()"
                  :disabled="loading || !mnemonicAcked">
            <span x-show="loading" class="spinner-border spinner-border-sm me-2"></span>
            <span x-text="loading ? '登録中...' : '登録する'"></span>
          </button>
          <button class="btn btn-outline-secondary" @click="goToChoose()" :disabled="loading">
            戻る
          </button>
        </div>
      </div>
    </template>

    <!-- ステップ 4: 完了 -->
    <template x-if="step === 'done'">
      <div class="text-center py-4">
        <i class="bi bi-check-circle-fill text-success display-1"></i>
        <h4 class="mt-3">鍵を登録しました</h4>
        <p class="text-muted">
          方式: <code x-text="doneMethod"></code><br>
          この鍵で暗号化が有効になりました。設定トップに戻ると、別方式の追加や
          鍵の削除ができます。
        </p>
        <a href="{{ url_for('settings.index') }}" class="btn btn-outline-secondary">
          設定トップへ戻る
        </a>
      </div>
    </template>

  </div>
</div>

<script type="module">
  // wizard.js が encryptionKeyWizard をグローバル登録する。Alpine の `x-data`
  // からは globalThis.encryptionKeyWizard() を直接呼び出す。
  import "{{ url_for('static', filename='js/crypto/wizard.js') }}";
</script>
{% endblock %}
