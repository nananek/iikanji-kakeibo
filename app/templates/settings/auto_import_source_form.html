{% extends "base.html" %}
{% block title %}インポート元の追加 - いいかんじ™家計簿{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <h2><i class="bi bi-folder-plus"></i> インポート元の追加</h2>

    <div class="card">
      <div class="card-body">
        <form method="POST" id="sourceForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label" for="nameInput">名前</label>
            <input type="text" class="form-control" name="name" id="nameInput"
                   placeholder="例: Nextcloud レシート" required maxlength="100">
          </div>

          <div class="mb-3">
            <label class="form-label" for="providerSelect">プロバイダー</label>
            <select class="form-select" name="provider" id="providerSelect">
              <option value="webdav" selected>WebDAV</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="urlInput">WebDAV URL</label>
            <input type="url" class="form-control" name="url" id="urlInput"
                   placeholder="https://cloud.example.com/remote.php/dav/files/username/レシート" required maxlength="500">
            <div class="form-text">
              Nextcloud の場合: <code>https://ホスト名/remote.php/dav/files/ユーザー名/フォルダ名</code>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="usernameInput">ユーザー名</label>
            <input type="text" class="form-control" name="username" id="usernameInput" required maxlength="100">
          </div>

          <div class="mb-3">
            <label class="form-label" for="passwordInput">パスワード</label>
            <input type="password" class="form-control" name="password" id="passwordInput" required>
            <div class="form-text">
              Nextcloud の場合はアプリパスワードの使用を推奨します。パスワードは暗号化して保存されます。
            </div>
          </div>

          <div id="testResult" class="mb-3" style="display:none"></div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary" id="testBtn">
              <i class="bi bi-plug"></i> 接続テスト
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg"></i> 保存
            </button>
            <a href="{{ url_for('settings.auto_import') }}" class="btn btn-outline-secondary">キャンセル</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('testBtn').addEventListener('click', async function() {
  const btn = this;
  const result = document.getElementById('testResult');
  const form = document.getElementById('sourceForm');
  const data = new FormData(form);

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> テスト中...';
  result.style.display = 'none';

  try {
    const resp = await fetch('{{ url_for("settings.auto_import_source_test") }}', {
      method: 'POST',
      body: data,
    });
    const json = await resp.json();
    result.style.display = 'block';
    result.className = 'mb-3 alert alert-' + (json.ok ? 'success' : 'danger');
    result.textContent = json.message;
  } catch (e) {
    result.style.display = 'block';
    result.className = 'mb-3 alert alert-danger';
    result.textContent = '接続テストに失敗しました。';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-plug"></i> 接続テスト';
  }
});
</script>
{% endblock %}
