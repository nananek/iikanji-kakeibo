{% extends "base.html" %}
{% block title %}リカバリコードでログイン - いいかんじ™家計簿{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="text-center mb-3"><i class="bi bi-shield-lock text-warning"></i> リカバリコードでログイン</h3>

        <div class="alert alert-warning small">
          <i class="bi bi-exclamation-triangle"></i>
          リカバリコードでのログインは <strong>1 回限り</strong> です。ログイン後は新しいパスキー登録とリカバリコードの再生成を完了するまで他の操作はできません。
        </div>

        <form method="POST" action="{{ url_for('auth.recovery_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">ユーザー名</label>
            <input type="text" name="username" class="form-control" required autofocus
                   autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">リカバリコード</label>
            <input type="text" name="recovery_code" class="form-control" required
                   placeholder="ikr_xxxxxxxx..."
                   autocomplete="off" spellcheck="false">
            <div class="form-text">「ikr_」で始まる長い文字列です。</div>
          </div>
          {% include "auth/_captcha_widget.html" %}
          <button type="submit" class="btn btn-warning w-100">
            <i class="bi bi-shield-lock"></i> リカバリコードでログイン
          </button>
        </form>

        <hr>
        <div class="text-center">
          <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> ログイン画面に戻る</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
