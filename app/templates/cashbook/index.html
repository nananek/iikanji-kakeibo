{% extends "base.html" %}
{% block title %}出納帳 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="cashbook-index-params" type="application/json">
{{ {"year": year, "user_id": effective_user_id} | tojson }}
</script>
<script id="cashbook-index-accounts-meta" type="application/json">
{{ accounts_meta | tojson }}
</script>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-wallet2"></i> 出納帳</h2>
  <div class="d-flex gap-2">
    <a href="{{ url_for('cashbook.new') }}" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> 新規記帳
    </a>
  </div>
</div>

<form class="row g-3 mb-4" method="GET">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 3, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
</form>

<div id="cashbook-index-status" class="d-none" role="status" aria-live="polite"></div>

<div id="cashbook-index-table" class="table-responsive d-none">
  <table class="table table-hover">
    <thead class="table-light">
      <tr>
        <th>No.</th>
        <th>日付</th>
        <th>摘要</th>
        <th>借方科目</th>
        <th>貸方科目</th>
        <th class="text-end">金額</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="cashbook-index-tbody"></tbody>
  </table>
</div>

<div id="cashbook-index-empty" class="text-center text-muted py-5 d-none">
  <i class="bi bi-journal-x" style="font-size: 3rem;"></i>
  <p class="mt-3">{{ year }}年の記帳はまだありません。</p>
  <a href="{{ url_for('cashbook.new') }}" class="btn btn-primary">記帳をする</a>
</div>

<script type="module" src="{{ url_for('static', filename='js/cashbook/index_renderer.mjs') }}"></script>
{% endblock %}
