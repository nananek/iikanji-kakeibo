{% extends "base.html" %}
{% block title %}医療費 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="medical-index-params" type="application/json">
{{ {"year": year, "user_id": effective_user_id, "is_audit_proxy": session.get('acting_as_user_id') is not none} | tojson }}
</script>
<script id="medical-index-accounts-meta" type="application/json">
{{ medical_accounts_meta | tojson }}
</script>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-hospital"></i> 医療費</h2>
  <a href="{{ url_for('medical.new') }}" class="btn btn-primary">
    <i class="bi bi-plus-lg"></i> 医療費を登録
  </a>
</div>

<form class="row g-3 mb-4" method="GET">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 2, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
</form>

<div id="medical-index-status" class="d-none" role="status" aria-live="polite"></div>

<div class="row mb-4">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-muted">支払医療費</h6>
        <h4 id="medical-total-paid">&yen;0</h4>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-muted">保険補填額</h6>
        <h4 id="medical-total-reimbursed">&yen;0</h4>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-muted">自己負担額</h6>
        <h4 id="medical-total-net">&yen;0</h4>
      </div>
    </div>
  </div>
</div>

<div id="medical-index-table" class="table-responsive d-none">
  <table class="table table-hover">
    <thead class="table-light">
      <tr>
        <th>日付</th>
        <th>摘要</th>
        <th>受診者</th>
        <th>病院・薬局</th>
        <th>区分</th>
        <th>メモ</th>
        <th class="text-end">支払額</th>
        <th class="text-end">保険補填</th>
        <th class="text-end">自己負担</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="medical-index-tbody"></tbody>
  </table>
</div>

<div id="medical-index-empty" class="text-center text-muted py-5 d-none">
  <p>{{ year }}年の医療費はまだありません。</p>
  <p><small>医療費科目（税区分: 医療費控除）への仕訳が自動的に集計されます。</small></p>
</div>

<!-- 医療費詳細編集モーダル -->
<div class="modal fade" id="medicalModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">医療費詳細</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="medicalModalError" class="alert alert-danger d-none"></div>
        <input type="hidden" id="medModalEntryId" value="">

        <div class="mb-3">
          <label for="medPatient" class="form-label">受診者</label>
          <input type="text" class="form-control" id="medPatient" list="patientList" maxlength="100" placeholder="例: 山田太郎" autocomplete="off">
          <datalist id="patientList"></datalist>
        </div>

        <div class="mb-3">
          <label for="medHospital" class="form-label">病院・薬局名</label>
          <input type="text" class="form-control" id="medHospital" list="hospitalList" maxlength="200" placeholder="例: ○○病院" autocomplete="off">
          <datalist id="hospitalList"></datalist>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label for="medProviderType" class="form-label">区分</label>
            <select class="form-select" id="medProviderType">
              <option value="">未設定</option>
              <option value="hospital">病院</option>
              <option value="pharmacy">薬局</option>
              <option value="nursing">介護</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="col-6">
            <label for="medReimbursement" class="form-label">保険補填額</label>
            <div class="input-group">
              <span class="input-group-text">&yen;</span>
              <input type="number" class="form-control" id="medReimbursement" min="0" value="0">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="medDescription" class="form-label">メモ</label>
          <input type="text" class="form-control" id="medDescription" maxlength="255" placeholder="例: 内科診察、処方薬">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-primary" id="medSaveBtn">
          <span class="spinner-border spinner-border-sm d-none" id="medSpinner"></span>
          保存
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/medical/index_renderer.mjs') }}"></script>
{% endblock %}
