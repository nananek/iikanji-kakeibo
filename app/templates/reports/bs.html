{% extends "base.html" %}
{% block title %}貸借対照表 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="bs-server-params" type="application/json">
{{ {
  "year": year,
  "min_year": min_year,
  "user_id": effective_user_id,
} | tojson }}
</script>
<script id="bs-accounts-meta" type="application/json">
{{ accounts_meta | tojson }}
</script>
<h2><i class="bi bi-clipboard-data"></i> 貸借対照表</h2>

<form class="row g-3 mb-4 mt-2" method="GET">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 2, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
</form>

<div id="bs-status" class="d-none" role="status" aria-live="polite"></div>

<div id="bs-closing-hint" class="alert alert-info py-2 d-none">
  <i class="bi bi-info-circle"></i> 損益振替前のため、当期純利益を純資産に加算して表示しています。
</div>

<div class="row">
  <div class="col-md-6 mb-3">
    <div class="card shadow-sm h-100">
      <div class="card-header"><strong>資産の部</strong></div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <tbody id="bs-assets-tbody"></tbody>
          <tfoot class="table-light">
            <tr>
              <th>資産合計</th>
              <th class="text-end" id="bs-assets-tbody-total">¥0</th>
            </tr>
          </tfoot>
        </table>
        <p id="bs-assets-empty" class="text-muted text-center py-3 mb-0">データなし</p>
      </div>
    </div>
  </div>

  <div class="col-md-6 mb-3">
    <div class="card shadow-sm mb-3">
      <div class="card-header"><strong>負債の部</strong></div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <tbody id="bs-liabilities-tbody"></tbody>
          <tfoot class="table-light">
            <tr>
              <th>負債合計</th>
              <th class="text-end" id="bs-liabilities-tbody-total">¥0</th>
            </tr>
          </tfoot>
        </table>
        <p id="bs-liabilities-empty" class="text-muted text-center py-3 mb-0">データなし</p>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header"><strong>純資産の部</strong></div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <tbody id="bs-equities-tbody"></tbody>
          <tfoot class="table-light">
            <tr>
              <th>純資産合計</th>
              <th class="text-end" id="bs-equities-tbody-total">¥0</th>
            </tr>
          </tfoot>
        </table>
        <p id="bs-equities-empty" class="text-muted text-center py-3 mb-0">データなし</p>
      </div>
    </div>
  </div>
</div>

<div class="row mt-3">
  <div class="col-md-6">
    <div id="bs-balance-card" class="card text-bg-success shadow-sm">
      <div class="card-body text-center py-2">
        <strong>資産合計:</strong> <span id="bs-balance-lhs">¥0</span>
        &nbsp;|&nbsp;
        <strong>負債+純資産合計:</strong> <span id="bs-balance-rhs">¥0</span>
        <i id="bs-balance-icon" class="bi bi-check-circle ms-1"></i><span id="bs-balance-diff" class="d-none"></span>
      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/reports/balance_sheet_renderer.mjs') }}"></script>
{% endblock %}
