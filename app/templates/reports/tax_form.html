{% extends "base.html" %}
{% block title %}青色申告決算書 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="tax-form-server-params" type="application/json">
{{ {
  "year": year, "form_type": form_type,
  "user_id": effective_user_id,
  "min_year": min_year,
  "is_audit_proxy": session.get('acting_as_user_id') is not none,
} | tojson }}
</script>
<script id="tax-form-accounts-meta" type="application/json">
{{ accounts_meta | tojson }}
</script>
<script id="tax-form-structure" type="application/json">
{{ form_structure | tojson }}
</script>
<h2><i class="bi bi-file-earmark-text"></i> 青色申告決算書
  <small class="text-muted">{{ year }}年</small>
</h2>

<ul class="nav nav-tabs mb-4 mt-3">
  <li class="nav-item">
    <a class="nav-link {% if form_type == 'general' %}active{% endif %}"
       href="{{ url_for('reports.tax_form_report', form_type='general', year=year) }}">
      <i class="bi bi-briefcase"></i> 一般用
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if form_type == 'real_estate' %}active{% endif %}"
       href="{{ url_for('reports.tax_form_report', form_type='real_estate', year=year) }}">
      <i class="bi bi-building"></i> 不動産所得用
    </a>
  </li>
</ul>

<form class="row g-3 mb-4" method="GET">
  <input type="hidden" name="form_type" value="{{ form_type }}">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 2, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
  <div class="col-auto ms-auto">
    <a href="{{ url_for('settings.tax_form', form_type=form_type) }}" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-gear"></i> マッピング設定
    </a>
  </div>
</form>

<div id="tax-form-status" class="d-none" role="status" aria-live="polite"></div>

{# --- P1: 損益計算書 --- #}
<div class="card shadow-sm mb-4">
  <div class="card-header"><strong>損益計算書</strong>（第1面）</div>
  <div class="card-body p-0">
    <table class="table table-sm table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th style="width:40px">欄</th>
          <th>科目</th>
          <th class="text-end" style="width:140px">金額</th>
        </tr>
      </thead>
      <tbody id="tax-form-pl-tbody"></tbody>
    </table>
  </div>
</div>

{# --- P4: 貸借対照表 --- #}
<div class="card shadow-sm mb-4">
  <div class="card-header"><strong>貸借対照表</strong>（第4面）</div>
  <div class="card-body p-0">
    <table class="table table-sm table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th style="width:40px">欄</th>
          <th>科目</th>
          <th class="text-end" style="width:140px">期首</th>
          <th class="text-end" style="width:140px">期末</th>
        </tr>
      </thead>
      <tbody id="tax-form-bs-tbody"></tbody>
    </table>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/reports/tax_form_renderer.mjs') }}"></script>
{% endblock %}
