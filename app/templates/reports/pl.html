{% extends "base.html" %}
{% block title %}損益計算書 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="pl-server-params" type="application/json">
{{ {"year": year, "month": month, "user_id": effective_user_id, "is_audit_proxy": session.get('acting_as_user_id') is not none, "biz_income": biz_income, "tax_form_url": url_for('reports.tax_form_report', year=year)} | tojson }}
</script>
<script id="pl-accounts-meta" type="application/json">
{{ accounts_meta | tojson }}
</script>
<h2><i class="bi bi-graph-up"></i> 損益計算書</h2>

<form class="row g-3 mb-4 mt-2" method="GET">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 2, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <select name="month" class="form-select">
      <option value="0" {% if month == 0 %}selected{% endif %}>年間</option>
      {% for m in range(1, 13) %}
      <option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m }}月</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
</form>

<div id="pl-status" class="d-none" role="status" aria-live="polite"></div>

<div class="row mb-4">
  <div class="col-md-4">
    <div class="card text-bg-primary shadow-sm">
      <div class="card-body text-center">
        <h6>収入合計</h6>
        <h3 id="pl-summary-income">¥0</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-bg-danger shadow-sm">
      <div class="card-body text-center">
        <h6>支出合計</h6>
        <h3 id="pl-summary-expense">¥0</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div id="pl-summary-balance-card" class="card text-bg-success shadow-sm">
      <div class="card-body text-center">
        <h6>収支差額</h6>
        <h3 id="pl-summary-balance">¥0</h3>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header"><strong>収入の内訳</strong></div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <tbody id="pl-income-tbody"></tbody>
        </table>
        <p id="pl-income-empty" class="text-muted text-center py-3 mb-0">収入データなし</p>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header"><strong>支出の内訳</strong></div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <tbody id="pl-expense-tbody"></tbody>
        </table>
        <p id="pl-expense-empty" class="text-muted text-center py-3 mb-0">支出データなし</p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/reports/profit_loss_renderer.mjs') }}"></script>
{% endblock %}
