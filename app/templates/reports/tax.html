{% extends "base.html" %}
{% block title %}確定申告用集計 - いいかんじ™家計簿{% endblock %}

{% block content %}
<script id="medical-summary-server-params" type="application/json">
{{ {"year": year, "user_id": effective_user_id, "is_audit_proxy": session.get('acting_as_user_id') is not none} | tojson }}
</script>
<script id="medical-summary-accounts-meta" type="application/json">
{{ medical_accounts_meta | tojson }}
</script>
<script id="tax-summary-server-params" type="application/json">
{{ {"year": year, "user_id": effective_user_id, "is_audit_proxy": session.get('acting_as_user_id') is not none} | tojson }}
</script>
<script id="tax-summary-accounts-meta" type="application/json">
{{ tax_accounts_meta | tojson }}
</script>
<h2><i class="bi bi-file-earmark-text"></i> 確定申告用集計</h2>

<form class="row g-3 mb-4 mt-2" method="GET">
  <div class="col-auto">
    <select name="year" class="form-select">
      {% for y in range(year - 2, year + 2) %}
      <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-outline-secondary">表示</button>
  </div>
</form>

<h4 class="mt-4">控除対象の支出</h4>

<div id="tax-summary-status" class="d-none" role="status" aria-live="polite"></div>
<div id="tax-summary-cards"></div>
<div id="tax-summary-empty" class="text-muted py-3 d-none">控除対象の支出データがありません。</div>

<div class="d-flex justify-content-between align-items-center mt-5">
  <h4>医療費控除</h4>
  <a id="medical-csv-link" href="{{ url_for('reports.medical_csv', year=year) }}" class="btn btn-outline-success btn-sm d-none">
    <i class="bi bi-download"></i> 医療費集計フォームCSV
  </a>
</div>

<div id="medical-summary-status" class="d-none" role="status" aria-live="polite"></div>

<div data-medical-summary-totals class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row text-center">
      <div class="col-md-4">
        <h6 class="text-muted">支払医療費合計</h6>
        <h4 id="medical-total-paid">¥0</h4>
      </div>
      <div class="col-md-4">
        <h6 class="text-muted">保険補填額</h6>
        <h4 id="medical-total-reimbursed">¥0</h4>
      </div>
      <div class="col-md-4">
        <h6 class="text-muted">自己負担額</h6>
        <h4 id="medical-total-net">¥0</h4>
      </div>
    </div>
  </div>
</div>

<div id="medical-by-patient"></div>

<details id="medical-expenses-details" class="d-none">
  <summary class="mb-2"><strong>明細一覧</strong> (<span id="medical-expenses-count">0</span>件)</summary>
  <div class="table-responsive">
    <table class="table table-sm">
      <thead class="table-light">
        <tr>
          <th>日付</th>
          <th>摘要</th>
          <th>受診者</th>
          <th>病院・薬局</th>
          <th>区分</th>
          <th class="text-end">支払額</th>
          <th class="text-end">保険補填</th>
        </tr>
      </thead>
      <tbody id="medical-expenses-tbody"></tbody>
    </table>
  </div>
</details>

<script type="module" src="{{ url_for('static', filename='js/reports/medical_summary_renderer.mjs') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/reports/tax_summary_renderer.mjs') }}"></script>
{% endblock %}
